<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Meta-graph Viewer</title>

<!--
  Pinned CDN builds (no bundler, opened via file://):
  - graphology 0.26.0 (matches engine/package.json's devDependency) UMD build: a plain <script>
    load, not a fetch, so it works from a file:// page. Exposes the global `graphology`, whose
    default export is the Graph constructor itself (also reachable as `graphology.Graph`).
  - sigma 3.0.3: its only browser-ready build under dist/ is `sigma.min.js` (a UMD bundle
    exposing the global `Sigma`); `sigma.cjs.min.js` and `sigma.esm.min.js` are CJS/ESM-only and
    do not work from a plain <script> tag, so this is the one that loads over file://.

  Sprites (issue #59): Pokémon Showdown (play.pokemonshowdown.com) sends no
  Access-Control-Allow-Origin, so a WebGL texture (sigma's node-image program) can't load one —
  the browser refuses to hand a tainted texture to the GPU. Drawing instead onto a plain 2D
  <canvas> layer (via sigma's createCanvasContext) needs no CORS: drawImage never reads the
  pixels back, it just composites, and a 2D canvas tainted by a cross-origin image only blocks
  getImageData/toDataURL, both unused here. The layer sits above sigma's own canvases (afterLayer:
  "hoverNodes") and is redrawn on sigma's "afterRender" so it tracks pan/zoom/hide exactly.
-->
<script src="https://cdn.jsdelivr.net/npm/graphology@0.26.0/dist/graphology.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sigma@3.0.3/dist/sigma.min.js"></script>

<style>
  :root { --bg: #0b0f19; --panel: #131b2e; --border: #28354d; --text: #f8fafc; --muted: #94a3b8; --accent: #38bdf8;
    --fs-panel: 0.93rem; --fs-panel-small: 0.82rem; --fs-panel-head: 0.8rem; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-size: 14px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  header { padding: 10px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  header h1 { font-size: 1rem; margin: 0; }
  #drop-zone { border: 1px dashed var(--border); border-radius: 6px; padding: 6px 10px; color: var(--muted); font-size: 0.8rem; }
  #drop-zone.dragover { border-color: var(--accent); color: var(--text); }
  #meta-line { color: var(--muted); font-size: 0.8rem; }
  #layout { display: flex; height: calc(100vh - 52px); }
  #sigma-container { flex: 1 1 auto; min-width: 0; position: relative; overflow: hidden; background: #05070c; }
  #sidebar-resizer { flex: 0 0 auto; width: 6px; cursor: col-resize; touch-action: none; background: var(--border); }
  #sidebar-resizer:hover, #sidebar-resizer.dragging { background: var(--accent); }
  #sidebar { flex: 0 0 auto; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
  body.resizing { user-select: none; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
  .panel h2 { font-size: var(--fs-panel-head); text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 0 0 6px 0; }
  .legend-row { display: flex; align-items: center; gap: 8px; margin: 4px 0; font-size: var(--fs-panel); }
  .legend-row span.label-text { flex: 1; }
  .swatch { width: 12px; height: 12px; border-radius: 2px; flex-shrink: 0; }
  .drill-btn, .back-btn, .close-btn { font-size: var(--fs-panel-head); padding: 3px 8px; background: var(--panel); border: 1px solid var(--border); color: var(--text); border-radius: 4px; cursor: pointer; }
  .drill-btn { margin-left: auto; }
  .back-btn { margin-bottom: 6px; }
  .drill-btn:hover, .back-btn:hover, .close-btn:hover { border-color: var(--accent); }
  .drill-heading { color: var(--muted); font-size: 0.86rem; margin-bottom: 4px; }
  #hover-info { font-size: var(--fs-panel); line-height: 1.45; white-space: pre-line; color: var(--text); }
  #hover-info.empty { color: var(--muted); }
  input[type="range"] { width: 100%; }
  #min-teams-label { color: var(--muted); font-size: var(--fs-panel); }
  #selected-info { font-size: var(--fs-panel); line-height: 1.45; }
  #selected-title { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 6px; }
  #selected-title strong { font-size: 1.05rem; }
  .credit { color: var(--muted); font-size: var(--fs-panel-small); }
  #selected-info details { margin: 2px 0; }
  #selected-info summary { cursor: pointer; }
  #selected-info summary:hover { color: var(--accent); }
  .team-line { margin: 4px 0 4px 4px; padding-left: 6px; border-left: 2px solid var(--border); }
  .team-line a { color: var(--accent); }
  .team-line .team-species, .team-line .team-archetype { color: var(--muted); }
</style>
</head>
<body>

<header>
  <h1>Meta-graph Viewer</h1>
  <input type="file" id="file-input" accept="application/json,.json">
  <div id="drop-zone">or drag a meta-graph.json here</div>
  <div id="meta-line">No graph loaded.</div>
</header>

<div id="layout">
  <div id="sigma-container"></div>
  <div id="sidebar-resizer" role="separator" aria-orientation="vertical" aria-label="Resize panel"></div>
  <div id="sidebar">
    <div class="panel" id="selected-panel" style="display: none;">
      <h2>Selected</h2>
      <div id="selected-info"></div>
    </div>
    <div class="panel">
      <h2>Hover</h2>
      <div id="hover-info" class="empty">Hover a species or an edge.</div>
    </div>
    <div class="panel">
      <h2>Min teams: <span id="min-teams-label">1</span></h2>
      <input type="range" id="min-teams-slider" min="1" max="1" value="1" step="1">
    </div>
    <div class="panel">
      <h2>Edges</h2>
      <label class="legend-row"><input type="checkbox" id="show-noncommunity-edges">Show edges outside the community graph (thin, grey)</label>
    </div>
    <div class="panel">
      <h2>Communities</h2>
      <div id="legend"></div>
    </div>
    <div class="panel credit" id="sprite-credit">
      Sprites: Pokémon Showdown. Pokémon © Nintendo, Creatures, GAME FREAK.
    </div>
    <div class="panel credit" id="ladder-credit" hidden></div>
  </div>
</div>

<script>
(function () {
  var fileInput = document.getElementById("file-input");
  var dropZone = document.getElementById("drop-zone");
  var metaLine = document.getElementById("meta-line");
  var hoverInfo = document.getElementById("hover-info");
  var selectedPanel = document.getElementById("selected-panel");
  var selectedInfo = document.getElementById("selected-info");
  var legendEl = document.getElementById("legend");
  var slider = document.getElementById("min-teams-slider");
  var sliderLabel = document.getElementById("min-teams-label");
  var container = document.getElementById("sigma-container");
  var nonCommunityToggle = document.getElementById("show-noncommunity-edges");
  var ladderCreditEl = document.getElementById("ladder-credit");
  var sidebar = document.getElementById("sidebar");
  var sidebarResizer = document.getElementById("sidebar-resizer");

  var renderer = null;
  var graph = null;
  var hiddenCommunities = new Set();
  var minTeams = 1;
  var showNonCommunityEdges = false;
  var currentData = null;
  var drillCommunityId = null; // set to a community id while its "Drill into" view is active
  var focusedNode = null; // set to a node id while focus mode is active (click a node / Escape / background click clears)

  var NONCOMMUNITY_EDGE_SIZE = 0.6;
  var NONCOMMUNITY_EDGE_COLOR = "#64748b";
  var UNCONNECTED_KEY = null; // node.community for a species outside every Louvain community (H3)
  var DRILL_OUTSIDE_COLOR = "#4b5563"; // grey for nodes/edges outside the drilled-into community
  var FOCUS_DIM_COLOR = "#1e293b"; // darker than DRILL_OUTSIDE_COLOR, so focus reads as a further dim, not a different state
  var SPRITE_DIM_ALPHA = 0.15; // dimmed nodes' sprites fade rather than disappear

  var SIDEBAR_DEFAULT = 440;
  var SIDEBAR_MIN = 320;
  var GRAPH_MIN = 480;
  var SIDEBAR_KEY = "vgc-coach.meta-graph.sidebarWidth";
  var sidebarWidth = SIDEBAR_DEFAULT;
  var sidebarDragging = false;

  // Pokémon Showdown sprites (issue #59). No crossOrigin on the Image: Showdown sends no
  // Access-Control-Allow-Origin, so a CORS request would just fail; a plain hot-link load works
  // and a 2D canvas drawImage never reads the pixels back, so the canvas taint doesn't matter.
  var SPRITE_BASE = "https://play.pokemonshowdown.com/sprites/gen5/";
  var SPRITE_MIN_RADIUS_PX = 4; // below this, the coloured disc alone is legible; skip the draw
  var SPRITE_SCALE = 1.3; // sprite square side = 2 * viewport radius * SPRITE_SCALE
  var ITEM_SHEET = "https://play.pokemonshowdown.com/sprites/itemicons-sheet.png";
  var ITEM_ICON_SIZE = 24;
  var ITEM_ICON_COLUMNS = 16;

  var spriteCache = {}; // spriteId -> { img: Image, ok: boolean (loaded) }

  // Returns the loaded Image for a spriteId, or null (not requested yet, still loading, or the
  // id/image failed) so the caller just skips drawing; the coloured disc stays underneath either way.
  function spriteImage(id) {
    if (!id) return null;
    var entry = spriteCache[id];
    if (!entry) {
      entry = { img: new Image(), ok: false };
      spriteCache[id] = entry;
      entry.img.onload = function () {
        entry.ok = true;
        if (renderer) renderer.scheduleRender();
      };
      entry.img.src = SPRITE_BASE + id + ".png";
    }
    return entry.ok ? entry.img : null;
  }

  function drawSprite(ctx, node, attrs) {
    var d = renderer.getNodeDisplayData(node);
    if (!d || d.hidden) return;
    var img = spriteImage(attrs.sprite);
    if (!img) return;
    var p = renderer.framedGraphToViewport(d);
    var r = renderer.scaleSize(d.size);
    if (r < SPRITE_MIN_RADIUS_PX) return;
    var side = 2 * r * SPRITE_SCALE;
    ctx.drawImage(img, p.x - side / 2, p.y - side / 2, side, side);
  }

  // Dimmed nodes first at SPRITE_DIM_ALPHA, then lit ones at full alpha: a focused node's sprite
  // fades along with its colour rather than disappearing (drawSprite already skips a hidden node).
  function drawSprites() {
    if (!renderer || !graph) return;
    var ctx = renderer.canvasContexts.sprites;
    if (!ctx) return;
    ctx.clearRect(0, 0, renderer.width, renderer.height);
    ctx.imageSmoothingEnabled = false;
    if (focusedNode !== null) {
      ctx.globalAlpha = SPRITE_DIM_ALPHA;
      graph.forEachNode(function (node, attrs) { if (!focusLit(node)) drawSprite(ctx, node, attrs); });
      ctx.globalAlpha = 1;
      graph.forEachNode(function (node, attrs) { if (focusLit(node)) drawSprite(ctx, node, attrs); });
    } else {
      graph.forEachNode(function (node, attrs) { drawSprite(ctx, node, attrs); });
    }
  }

  function fmtPct(x) { return typeof x === "number" ? (x * 100).toFixed(1) + "%" : "n/a"; }
  function fmtNum(x) { return typeof x === "number" ? x.toFixed(2) : "n/a"; }

  // Looks up a community by id, or null for none/not found.
  function findCommunity(id) {
    if (id === null || id === undefined || !currentData) return null;
    return currentData.communities.find(function (c) { return c.id === id; }) || null;
  }

  // Looks up a sub-community by its parent's id and its own id (both from the drilled-into node/legend state).
  function findSubCommunity(parentId, subId) {
    if (subId === null || subId === undefined || !currentData) return null;
    var parent = currentData.communities.find(function (c) { return c.id === parentId; });
    return (parent && parent.subCommunities || []).find(function (s) { return s.id === Number(subId); }) || null;
  }

  function subCommunityColor(parentId, subId) { var s = findSubCommunity(parentId, subId); return s ? s.color : DRILL_OUTSIDE_COLOR; }
  function subCommunityLabel(parentId, subId) { var s = findSubCommunity(parentId, subId); return s ? (s.label || "Sub-community " + s.id) : "Sub-community " + subId; }

  // Edges keep every pair (incl. lift < 1); only inCommunityGraph edges fed Louvain/layout (M6).
  // louvainWeight sizes an edge when the producer supplies it; older JSON without it (or a
  // non-community edge, always drawn thin) falls back to a constant by isCore.
  function maxLouvainWeight(edges) {
    var max = 0;
    edges.forEach(function (e) {
      if (typeof e.louvainWeight === "number" && e.louvainWeight > max) max = e.louvainWeight;
    });
    return max;
  }

  function baseEdgeSize(e, maxWeight) {
    if (typeof e.louvainWeight === "number" && maxWeight > 0) {
      return 0.6 + (Math.max(0, e.louvainWeight) / maxWeight) * 4.4;
    }
    return e.isCore ? 2.5 : 1.4;
  }

  function buildGraph(data) {
    var g = new graphology.Graph();
    data.nodes.forEach(function (n) {
      g.addNode(n.id, {
        label: n.label,
        x: n.x,
        y: n.y,
        size: n.size,
        color: n.color,
        community: n.community === undefined ? null : n.community,
        variants: n.variants || [],
        roles: n.roles || {},
        teams: n.teams,
        weightedSupport: n.weightedSupport,
        subCommunity: n.subCommunity === undefined ? null : n.subCommunity,
        subCommunityShares: n.subCommunityShares || null,
        sprite: n.sprite === undefined ? null : n.sprite,
        items: n.items || [],
        archetypes: n.archetypes || null,
        sampleTeams: n.sampleTeams || null,
        subTokens: n.subTokens || null,
      });
    });
    var maxWeight = maxLouvainWeight(data.edges);
    data.edges.forEach(function (e) {
      if (!g.hasNode(e.source) || !g.hasNode(e.target)) return;
      if (g.hasUndirectedEdge(e.source, e.target)) return;
      g.addUndirectedEdge(e.source, e.target, {
        teams: e.teams,
        weightedSupport: e.weightedSupport,
        lift: e.lift,
        confidenceAGivenB: e.confidenceAGivenB,
        confidenceBGivenA: e.confidenceBGivenA,
        isCore: e.isCore,
        louvainWeight: e.louvainWeight,
        inCommunityGraph: e.inCommunityGraph,
        conditional: e.conditional,
        conditionalReverse: e.conditionalReverse,
        baseSize: baseEdgeSize(e, maxWeight),
        baseColor: e.isCore ? "#f59e0b" : "#334155",
      });
    });
    return g;
  }

  function appendSwatchText(row, color, text) {
    var swatch = document.createElement("span");
    swatch.className = "swatch";
    swatch.style.background = color;
    var label = document.createElement("span");
    label.className = "label-text";
    label.textContent = text;
    row.appendChild(swatch);
    row.appendChild(label);
  }

  // The focused node's community key (its "community" attribute, Unconnected being null), or
  // undefined when nothing is focused: lets a checkbox tell whether hiding its own community should
  // clear focus too.
  function focusedCommunityKey() {
    if (focusedNode === null || !graph || !graph.hasNode(focusedNode)) return undefined;
    var attrs = graph.getNodeAttributes(focusedNode);
    return attrs.community === undefined ? null : attrs.community;
  }

  function communityLegendRow(label, color, detail, hideKey, community) {
    var row = document.createElement("label");
    row.className = "legend-row";
    var box = document.createElement("input");
    box.type = "checkbox";
    box.checked = true;
    box.addEventListener("change", function () {
      if (box.checked) {
        hiddenCommunities.delete(hideKey);
      } else {
        hiddenCommunities.add(hideKey);
        // Unchecking the focused node's own community (incl. Unconnected, hideKey null) clears
        // focus; unchecking another community only hides its nodes (hidden wins over focus).
        if (focusedNode !== null && focusedCommunityKey() === hideKey) {
          setFocus(null);
        }
      }
      if (renderer) renderer.refresh();
    });
    row.appendChild(box);
    appendSwatchText(row, color, label + " " + detail);
    if (community && community.subCommunities && community.subCommunities.length > 0) {
      var drillBtn = document.createElement("button");
      drillBtn.type = "button";
      drillBtn.className = "drill-btn";
      drillBtn.textContent = "Drill into";
      drillBtn.addEventListener("click", function () { setDrill(community.id); });
      row.appendChild(drillBtn);
    }
    return row;
  }

  // Set only in a sync:archetypes run with overrides (ADR 0018): a minor flag, or the label of the entry this one was merged into.
  function overrideNote(entry) {
    return (entry.minor ? " (minor)" : "") + (entry.mergedInto ? " merged into " + entry.mergedInto : "");
  }

  // Report §12.4's share under the ladder-calibrated team weights, present only in a run with ladderBlend above 0.
  function calibratedNote(share) {
    return typeof share === "number" ? " · ladder-calibrated " + fmtPct(share) : "";
  }

  function subCommunityLegendRow(sub) {
    var row = document.createElement("div");
    row.className = "legend-row";
    var label = sub.label ? sub.label : "Sub-community " + sub.id;
    appendSwatchText(row, sub.color, label + " (" + sub.memberCount + " tokens, " + fmtPct(sub.primaryShareOfParent) +
      " primary + " + fmtPct(sub.hybridShareOfParent) + " hybrid of parent" + calibratedNote(sub.calibratedPrimaryShareOfParent) + ")" + overrideNote(sub));
    return row;
  }

  function setDrill(communityId) {
    drillCommunityId = communityId;
    renderLegend(currentData);
    if (renderer) renderer.refresh();
  }

  function renderLegend(data) {
    legendEl.innerHTML = "";
    var drilled = drillCommunityId !== null && data.communities.find(function (c) { return c.id === drillCommunityId && c.subCommunities; });
    if (drilled) {
      var backBtn = document.createElement("button");
      backBtn.type = "button";
      backBtn.className = "back-btn";
      backBtn.textContent = "← Back";
      backBtn.addEventListener("click", function () { setDrill(null); });
      legendEl.appendChild(backBtn);
      var heading = document.createElement("div");
      heading.className = "drill-heading";
      heading.textContent = "Drilled into: " + (drilled.label ? drilled.label : "Community " + drilled.id);
      legendEl.appendChild(heading);
      drilled.subCommunities.forEach(function (s) { legendEl.appendChild(subCommunityLegendRow(s)); });
      return;
    }
    drillCommunityId = null;
    data.communities.forEach(function (c) {
      var label = c.label ? c.label : "Community " + c.id;
      var detail = "(" + c.memberCount + " species, " + fmtPct(c.primaryShare) + " + " + fmtPct(c.hybridShare) + " hybrid" +
        calibratedNote(c.calibratedPrimaryShare) + ")" + overrideNote(c);
      legendEl.appendChild(communityLegendRow(label, c.color, detail, c.id, c));
    });
    var unconnected = data.nodes.filter(function (n) { return n.community === null || n.community === undefined; });
    if (unconnected.length > 0) {
      legendEl.appendChild(communityLegendRow("Unconnected", "#888888", "(" + unconnected.length + " species)", UNCONNECTED_KEY));
    }
  }

  function edgeVisible(attrs) {
    if ((attrs.teams || 0) < minTeams) return false;
    return true;
  }

  // The one hide predicate (hidden community, minTeams, the non-community-edges toggle), shared by
  // edgeReducer and focusLit's neighbour test, so a filtered edge dims a neighbour the same way it
  // hides an edge.
  function edgeHidden(edge, attrs) {
    var extremities = graph.extremities(edge);
    var sourceAttrs = graph.getNodeAttributes(extremities[0]);
    var targetAttrs = graph.getNodeAttributes(extremities[1]);
    if (hiddenCommunities.has(sourceAttrs.community) || hiddenCommunities.has(targetAttrs.community)) return true;
    if (!edgeVisible(attrs)) return true;
    if (attrs.inCommunityGraph === false && !showNonCommunityEdges) return true;
    return false;
  }

  // Whether a node reads at full colour in focus mode: the focused node itself, every node when no
  // focus is active, or a neighbour reached only through a visible edge (a neighbour reached only
  // through a filtered-out edge dims too, so the min-teams slider and the edge toggle still apply).
  function focusLit(node) {
    if (focusedNode === null || node === focusedNode) return true;
    var e = graph.undirectedEdge(focusedNode, node);
    return e !== undefined && !edgeHidden(e, graph.getEdgeAttributes(e));
  }

  function nodeReducer(node, attrs) {
    var res = Object.assign({}, attrs);
    if (hiddenCommunities.has(attrs.community)) res.hidden = true;
    if (drillCommunityId !== null) {
      res.color = attrs.community === drillCommunityId ? subCommunityColor(drillCommunityId, attrs.subCommunity) : DRILL_OUTSIDE_COLOR;
    }
    // Focus mode, applied last (after hide and drill colouring) and only to a node still visible:
    // focus never un-hides.
    if (!res.hidden && focusedNode !== null) {
      if (focusLit(node)) {
        res.zIndex = 1;
        res.forceLabel = true;
        if (node === focusedNode) res.highlighted = true;
      } else {
        res.color = FOCUS_DIM_COLOR;
        res.label = null;
        res.zIndex = 0;
      }
    }
    return res;
  }

  function edgeReducer(edge, attrs) {
    var res = Object.assign({}, attrs);
    res.size = attrs.baseSize;
    res.color = attrs.baseColor;
    if (edgeHidden(edge, attrs)) {
      res.hidden = true;
    } else if (attrs.inCommunityGraph === false) {
      res.size = NONCOMMUNITY_EDGE_SIZE;
      res.color = NONCOMMUNITY_EDGE_COLOR;
    }
    if (drillCommunityId !== null) {
      var extremities = graph.extremities(edge);
      var sourceAttrs = graph.getNodeAttributes(extremities[0]);
      var targetAttrs = graph.getNodeAttributes(extremities[1]);
      var bothInDrill = sourceAttrs.community === drillCommunityId && targetAttrs.community === drillCommunityId;
      if (!bothInDrill) {
        res.size = NONCOMMUNITY_EDGE_SIZE;
        res.color = DRILL_OUTSIDE_COLOR;
      }
    }
    // Focus mode, applied last and only to an edge still visible: never un-hides.
    if (!res.hidden && focusedNode !== null) {
      var ext = graph.extremities(edge);
      var incident = ext[0] === focusedNode || ext[1] === focusedNode;
      if (incident) {
        res.zIndex = 1;
      } else {
        res.color = FOCUS_DIM_COLOR;
        res.size = Math.min(res.size, 0.5);
        res.zIndex = 0;
      }
    }
    return res;
  }

  function showNode(id, attrs) {
    var variants = (attrs.variants || [])
      .map(function (v) { return "  " + v.signature + " (" + fmtPct(v.weightedShare) + ")"; })
      .join("\n") || "  none";
    var roles = Object.keys(attrs.roles || {})
      .filter(function (r) { return attrs.roles[r] > 0; })
      .map(function (r) { return r + " " + fmtPct(attrs.roles[r]); })
      .join(", ") || "none";
    var subShares = "";
    if (attrs.subCommunityShares) {
      subShares = "\nsub-communities:\n" + Object.keys(attrs.subCommunityShares)
        .map(function (k) { return "  " + subCommunityLabel(attrs.community, k) + ": " + fmtPct(attrs.subCommunityShares[k]); })
        .join("\n");
    }
    hoverInfo.className = "";
    hoverInfo.textContent =
      id + "\n" +
      "community: " + (attrs.community === null || attrs.community === undefined ? "unconnected" : attrs.community) + "\n" +
      "teams: " + attrs.teams + ", support: " + fmtPct(attrs.weightedSupport) + "\n" +
      "roles: " + roles + "\n" +
      "variants:\n" + variants +
      subShares;
    hoverInfo.appendChild(itemsRow(attrs.items));
  }

  // The node's top items: an icon (the Showdown item-icon sheet, cropped by background-position)
  // beside "Item 42.0%" when the JSON gave it an icon index, text only otherwise.
  function itemsRow(items) {
    var row = document.createElement("div");
    row.style.display = "flex";
    row.style.flexWrap = "wrap";
    row.style.gap = "6px";
    row.style.marginTop = "6px";
    (items || []).forEach(function (it) {
      var entry = document.createElement("span");
      entry.style.display = "inline-flex";
      entry.style.alignItems = "center";
      entry.style.gap = "3px";
      if (typeof it.icon === "number") {
        var icon = document.createElement("span");
        icon.style.display = "inline-block";
        icon.style.width = ITEM_ICON_SIZE + "px";
        icon.style.height = ITEM_ICON_SIZE + "px";
        icon.style.flexShrink = "0";
        icon.style.backgroundImage = "url(" + ITEM_SHEET + ")";
        icon.style.backgroundRepeat = "no-repeat";
        icon.style.backgroundPosition = "-" + (it.icon % ITEM_ICON_COLUMNS) * ITEM_ICON_SIZE + "px -" + Math.floor(it.icon / ITEM_ICON_COLUMNS) * ITEM_ICON_SIZE + "px";
        entry.appendChild(icon);
      }
      var label = document.createElement("span");
      label.textContent = it.item + " " + fmtPct(it.share);
      entry.appendChild(label);
      row.appendChild(entry);
    });
    return row;
  }

  function fmtConditional(c) {
    if (!c) return "n/a (below conditionalMinTeams)";
    var items = Object.keys(c.items || {}).map(function (k) { return k + " " + fmtPct(c.items[k]); }).join(", ") || "none";
    var spreads = Object.keys(c.spreadTags || {}).map(function (k) { return k + " " + fmtPct(c.spreadTags[k]); }).join(", ") || "none";
    var moves = Object.keys(c.moveShifts || {}).map(function (k) { return k + " " + (c.moveShifts[k] >= 0 ? "+" : "") + c.moveShifts[k].toFixed(0) + "pp"; }).join(", ") || "none";
    return "items: " + items + "\nspreads: " + spreads + "\nmoves: " + moves;
  }

  // conditional is source's distribution given target, conditionalReverse the other way (report.ts).
  function showEdge(id, attrs) {
    var extremities = graph.extremities(id);
    var source = extremities[0];
    var target = extremities[1];
    hoverInfo.className = "";
    hoverInfo.textContent =
      source + " + " + target + "\n" +
      "teams: " + attrs.teams + ", support: " + fmtPct(attrs.weightedSupport) + "\n" +
      "lift: " + fmtNum(attrs.lift) + ", core: " + (attrs.isCore ? "yes" : "no") + "\n" +
      "conf(A|B): " + fmtNum(attrs.confidenceAGivenB) + ", conf(B|A): " + fmtNum(attrs.confidenceBGivenA) + "\n" +
      (attrs.inCommunityGraph === false ? "outside community graph\n" : "") +
      source + " given " + target + ":\n" + fmtConditional(attrs.conditional) + "\n" +
      target + " given " + source + ":\n" + fmtConditional(attrs.conditionalReverse);
  }

  function clearHover() {
    hoverInfo.className = "empty";
    hoverInfo.textContent = "Hover a species or an edge.";
  }

  // A community's label ("Community <id>" when it carries none) with its overrideNote, or
  // "unconnected" for null/undefined.
  function communityLabelText(communityId) {
    if (communityId === null || communityId === undefined) return "unconnected";
    var c = findCommunity(communityId);
    if (!c) return "Community " + communityId;
    return (c.label ? c.label : "Community " + c.id) + overrideNote(c);
  }

  // The label of an archetype row or a ViewerTeam (same community/subCommunity shape): "No
  // archetype" for community null, else the community label (with its overrideNote), plus " · <sub
  // label>" when subCommunity is a number (with the sub-community's own overrideNote) or " ·
  // unassigned within the parent" when it is null (the key is absent for a no-pass community, so
  // the label stops at the community).
  function archetypeRowLabel(row) {
    if (row.community === null || row.community === undefined) return "No archetype";
    var label = communityLabelText(row.community);
    if ("subCommunity" in row) {
      label += row.subCommunity === null ? " · unassigned within the parent" : " · " + subCommunityLabel(row.community, row.subCommunity);
      label += overrideNote(findSubCommunity(row.community, row.subCommunity) || {});
    }
    return label;
  }

  // The representative teams an archetype row's <details> expands to: the sub-community's when
  // subCommunity is a number, else the community's; null when the row has no community (nothing to look up).
  function archetypeRepresentatives(row) {
    if (row.community === null || row.community === undefined) return null;
    var community = findCommunity(row.community);
    if (!community) return null;
    if (typeof row.subCommunity === "number") {
      var sub = (community.subCommunities || []).find(function (s) { return s.id === row.subCommunity; });
      return sub ? sub.representativeTeams : null;
    }
    return community.representativeTeams || null;
  }

  // One team line: "player · placement · event · date" (a link when pasteUrl is http(s), text
  // otherwise -- never innerHTML with data), its species, and its archetype label.
  function teamLine(t) {
    var row = document.createElement("div");
    row.className = "team-line";
    var summary = document.createElement("div");
    var text = (t.player || "n/a") + " · " + (t.placement || "n/a") + " · " + (t.event || "n/a") + " · " + (t.date || "n/a");
    if (/^https?:\/\//i.test(t.pasteUrl)) {
      var link = document.createElement("a");
      link.href = t.pasteUrl;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = text;
      summary.appendChild(link);
    } else {
      summary.textContent = text;
    }
    row.appendChild(summary);
    var species = document.createElement("div");
    species.className = "team-species";
    species.textContent = (t.species || []).join(" / ");
    row.appendChild(species);
    var archetype = document.createElement("div");
    archetype.className = "team-archetype";
    archetype.textContent = archetypeRowLabel(t);
    row.appendChild(archetype);
    return row;
  }

  // One "On teams of" row: a plain line for "No archetype" (community null, nothing to expand);
  // otherwise a native <details> (an id to look up) whose body lists that archetype's
  // representative teams.
  function archetypeRow(row) {
    var summary = archetypeRowLabel(row) + " — " + fmtPct(row.share) + ", " + row.teams + " team" + (row.teams === 1 ? "" : "s");
    if (row.community === null || row.community === undefined) {
      var div = document.createElement("div");
      div.className = "legend-row";
      div.textContent = summary;
      return div;
    }
    var details = document.createElement("details");
    var summaryEl = document.createElement("summary");
    summaryEl.textContent = summary;
    details.appendChild(summaryEl);
    (archetypeRepresentatives(row) || []).forEach(function (t) { details.appendChild(teamLine(t)); });
    return details;
  }

  // "Node of": swatch + community label with its overrideNote, or "unconnected"; then, when this
  // community has a sub-community pass and the node carries variant tokens, one line per token.
  function nodeOfSection(attrs) {
    var wrap = document.createElement("div");
    var communityId = attrs.community === undefined ? null : attrs.community;
    var community = findCommunity(communityId);
    var row = document.createElement("div");
    row.className = "legend-row";
    if (community) {
      appendSwatchText(row, community.color, (community.label || "Community " + community.id) + overrideNote(community));
    } else {
      appendSwatchText(row, "#888888", "unconnected");
    }
    wrap.appendChild(row);
    if (attrs.subTokens) {
      attrs.subTokens.forEach(function (t) {
        var line = document.createElement("div");
        line.textContent = t.token + " → " + subCommunityLabel(communityId, t.subCommunity) + " (" + t.teams + " team" + (t.teams === 1 ? "" : "s") + ")";
        wrap.appendChild(line);
      });
    }
    return wrap;
  }

  // The Selected panel (above Hover): hidden while nothing is focused. Older viewer JSON (no
  // archetypes/sampleTeams) degrades to the "Node of" line only. DOM built with textContent/element
  // methods throughout, never innerHTML with data.
  function renderSelected() {
    selectedInfo.textContent = "";
    if (focusedNode === null || !graph || !graph.hasNode(focusedNode)) {
      selectedPanel.style.display = "none";
      return;
    }
    var attrs = graph.getNodeAttributes(focusedNode);
    selectedPanel.style.display = "";

    var titleRow = document.createElement("div");
    titleRow.id = "selected-title";
    var title = document.createElement("strong");
    title.textContent = focusedNode;
    titleRow.appendChild(title);
    var closeBtn = document.createElement("button");
    closeBtn.type = "button";
    closeBtn.className = "close-btn";
    closeBtn.textContent = "Close";
    closeBtn.addEventListener("click", function () { setFocus(null); });
    titleRow.appendChild(closeBtn);
    selectedInfo.appendChild(titleRow);

    selectedInfo.appendChild(nodeOfSection(attrs));

    if (attrs.archetypes) {
      var archHeading = document.createElement("div");
      archHeading.className = "drill-heading";
      archHeading.textContent = "On teams of (primary archetype, share of its weighted teams)";
      selectedInfo.appendChild(archHeading);
      attrs.archetypes.forEach(function (row) { selectedInfo.appendChild(archetypeRow(row)); });
    }

    if (attrs.sampleTeams && attrs.sampleTeams.length > 0) {
      var samplesHeading = document.createElement("div");
      samplesHeading.className = "drill-heading";
      samplesHeading.textContent = "Sample teams";
      selectedInfo.appendChild(samplesHeading);
      attrs.sampleTeams.forEach(function (t) { selectedInfo.appendChild(teamLine(t)); });
    }
  }

  function setFocus(node) {
    focusedNode = node;
    renderSelected();
    if (renderer) renderer.refresh();
  }

  function initSlider(data) {
    var maxTeams = data.edges.reduce(function (m, e) { return Math.max(m, e.teams || 0); }, 1);
    slider.min = 1;
    slider.max = maxTeams;
    slider.value = 1;
    minTeams = 1;
    sliderLabel.textContent = "1";
    slider.oninput = function () {
      minTeams = Number(slider.value);
      sliderLabel.textContent = String(minTeams);
      if (renderer) renderer.refresh();
    };
  }

  nonCommunityToggle.addEventListener("change", function () {
    showNonCommunityEdges = nonCommunityToggle.checked;
    if (renderer) renderer.refresh();
  });

  // Registered once (not per loadJson, since it doesn't depend on the renderer): Escape clears focus.
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") setFocus(null);
  });

  // Keeps the panel between SIDEBAR_MIN and window.innerWidth - GRAPH_MIN, so the graph always
  // keeps a usable minimum even on a narrow window.
  function clampWidth(w) {
    return Math.max(SIDEBAR_MIN, Math.min(w, window.innerWidth - GRAPH_MIN));
  }

  // Sigma's own render() calls resize(), which re-reads container.offsetWidth and resizes every
  // canvas layer (incl. the "sprites" 2D context) -- scheduleRefresh() is what sigma's own
  // window-resize handler calls, so a drag follows the same path instead of a synchronous
  // resize(true)/refresh() per pointermove.
  function applySidebarWidth(px, save) {
    sidebarWidth = px;
    sidebar.style.width = px + "px";
    if (renderer) renderer.scheduleRefresh();
    if (save) {
      try { localStorage.setItem(SIDEBAR_KEY, String(Math.round(px))); } catch (e) { /* storage disabled */ }
    }
  }

  sidebarResizer.addEventListener("pointerdown", function (e) {
    if (e.button !== 0) return;
    sidebarDragging = true;
    sidebarResizer.setPointerCapture(e.pointerId);
    sidebarResizer.classList.add("dragging");
    document.body.classList.add("resizing");
    e.preventDefault();
  });
  sidebarResizer.addEventListener("pointermove", function (e) {
    if (!sidebarDragging) return;
    applySidebarWidth(clampWidth(window.innerWidth - e.clientX - 3), false);
  });
  function endSidebarDrag(e) {
    if (!sidebarDragging) return;
    sidebarDragging = false;
    sidebarResizer.classList.remove("dragging");
    document.body.classList.remove("resizing");
    try { sidebarResizer.releasePointerCapture(e.pointerId); } catch (err) { /* already released */ }
    applySidebarWidth(sidebarWidth, true);
  }
  sidebarResizer.addEventListener("pointerup", endSidebarDrag);
  sidebarResizer.addEventListener("pointercancel", endSidebarDrag);

  // Re-clamp without saving: a narrower window shouldn't overwrite the width the player chose.
  window.addEventListener("resize", function () {
    applySidebarWidth(clampWidth(sidebarWidth), false);
  });

  (function initSidebarWidth() {
    var stored = SIDEBAR_DEFAULT;
    try {
      var raw = localStorage.getItem(SIDEBAR_KEY);
      var parsed = parseInt(raw, 10);
      if (!isNaN(parsed) && parsed > 0) stored = parsed;
    } catch (e) { /* storage disabled */ }
    applySidebarWidth(clampWidth(stored), false);
  })();

  function loadJson(text) {
    var data = JSON.parse(text);
    currentData = data;
    drillCommunityId = null;
    hiddenCommunities = new Set();
    focusedNode = null;
    graph = buildGraph(data);
    if (renderer) renderer.kill();
    // zIndex: true, so nodeReducer/edgeReducer's zIndex (focus mode) actually reorders the draw.
    renderer = new Sigma(graph, container, { nodeReducer: nodeReducer, edgeReducer: edgeReducer, zIndex: true });
    renderer.createCanvasContext("sprites", { afterLayer: "hoverNodes" });
    renderer.resize(true);
    renderer.on("afterRender", drawSprites);
    renderer.scheduleRender(); // the sprites layer was created after Sigma's own initial render, so kick off the first sprite paint
    renderer.on("enterNode", function (ev) { showNode(ev.node, graph.getNodeAttributes(ev.node)); });
    renderer.on("leaveNode", clearHover);
    renderer.on("enterEdge", function (ev) { showEdge(ev.edge, graph.getEdgeAttributes(ev.edge)); });
    renderer.on("leaveEdge", clearHover);
    // clickEdge: nothing. clickNode toggles focus on/off; clickStage (background) clears it.
    renderer.on("clickNode", function (ev) { setFocus(ev.node === focusedNode ? null : ev.node); });
    renderer.on("clickStage", function () { setFocus(null); });
    renderLegend(data);
    if (data.ladder) {
      ladderCreditEl.textContent = "Ladder calibration (λ " + data.ladder.ladderBlend + "), median rank over " + data.ladder.snapshots + " daily snapshot" + (data.ladder.snapshots === 1 ? "" : "s") + ", " + data.ladder.since + " to " + data.ladder.date + ": " + data.ladder.credit;
      ladderCreditEl.hidden = false;
    } else {
      ladderCreditEl.textContent = "";
      ladderCreditEl.hidden = true;
    }
    initSlider(data);
    renderSelected();
    showNonCommunityEdges = false;
    nonCommunityToggle.checked = false;
    metaLine.textContent =
      data.regulation + " · as of " + data.asOf + " · " + data.days + "d window · " +
      data.teamsAnalyzed + " teams · " + data.nodes.length + " species · " + data.edges.length + " pairs";
  }

  fileInput.addEventListener("change", function () {
    var file = fileInput.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () { loadJson(reader.result); };
    reader.readAsText(file);
  });

  ["dragenter", "dragover"].forEach(function (evt) {
    document.addEventListener(evt, function (e) {
      e.preventDefault();
      dropZone.classList.add("dragover");
    });
  });
  ["dragleave", "drop"].forEach(function (evt) {
    document.addEventListener(evt, function (e) {
      e.preventDefault();
      dropZone.classList.remove("dragover");
    });
  });
  document.addEventListener("drop", function (e) {
    var file = e.dataTransfer.files && e.dataTransfer.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () { loadJson(reader.result); };
    reader.readAsText(file);
  });

  // Served over http(s) (e.g. `npx serve viewer`): fetch the JSON next to this page automatically.
  // Over file://, fetch always fails (ADR 0017), so the file picker and drag-and-drop stay the only paths.
  function loadFromServer() {
    metaLine.textContent = "Loading meta-graph.json…";
    fetch("./meta-graph.json")
      .then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.text();
      })
      .then(loadJson)
      .catch(function (err) {
        metaLine.textContent = "Could not load meta-graph.json (" + err.message + "). Use the file picker or drag a file here.";
      });
  }

  if (location.protocol.indexOf("http") === 0) loadFromServer();
})();
</script>

</body>
</html>
